<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Barbier - Enregistrement Client</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(145deg, #f4f4f4, #e0e0e0);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      min-height: 100vh;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
      color: #111;
    }

    p {
      font-size: 1rem;
      color: #555;
    }

    .card {
      background: white;
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
    }

    input, button {
      width: 100%;
      margin-top: 1rem;
      padding: 0.8rem;
      font-size: 1rem;
      border-radius: 0.5rem;
      border: 1px solid #ccc;
    }

    button {
      background: #3B82F6;
      color: white;
      font-weight: 600;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background: #2563EB;
    }

    #formulaire {
      display: none;
      flex-direction: column;
    }

    #result, #loading {
      margin-top: 1rem;
      font-weight: bold;
      color: #1F2937;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Bienvenue chez votre Barbier</h1>
    <p>Validez votre passage ou inscrivez-vous</p>

    <input type="tel" id="numero" placeholder="📱 Numéro de téléphone">
    <button onclick="checkIn()">Valider ma visite</button>

    <div id="formulaire">
      <input type="text" id="prenom" placeholder="🧍‍♂️ Prénom">
      <input type="email" id="email" placeholder="📧 Email">
      <button onclick="inscrireClient()">S'inscrire</button>
    </div>

    <div id="loading" style="display: none;">⏳ Chargement...</div>
    <div id="result"></div>
  </div>

  <script>
    async function checkIn() {
      const numero = document.getElementById('numero').value.trim();
      const resultDiv = document.getElementById('result');
      const formulaire = document.getElementById('formulaire');
      const loading = document.getElementById('loading');

      if (!numero) {
        resultDiv.innerText = "❌ Merci d’entrer un numéro.";
        return;
      }

      loading.style.display = 'block';
      formulaire.style.display = 'none';
      resultDiv.innerText = "";

      try {
        const response = await fetch("/api/checkin", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ numero })
        });

        const message = await response.text();
        resultDiv.innerText = message;

        if (message.includes("Numéro inconnu")) {
          formulaire.style.display = 'flex';
        }
      } catch (error) {
        resultDiv.innerText = "❌ Erreur de connexion.";
      }

      loading.style.display = 'none';
    }

    async function inscrireClient() {
      const numero = document.getElementById('numero').value.trim();
      const prenom = document.getElementById('prenom').value.trim();
      const email = document.getElementById('email').value.trim();
      const resultDiv = document.getElementById('result');
      const loading = document.getElementById('loading');

      if (!numero || !prenom || !email) {
        resultDiv.innerText = "❌ Merci de remplir tous les champs.";
        return;
      }

      loading.style.display = 'block';
      resultDiv.innerText = "";

      try {
        const response = await fetch("https://odrgqvseddbbvvywguml.supabase.co/functions/v1/checkin", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9kcmdxdnNlZGRiYnZ2eXdndW1sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTMyMTI4MzQsImV4cCI6MjA2ODc4ODgzNH0.zbWnDGbsdhY6u_YUs_2cLmN3UxtLp9oPn8l89iLWUyE"
          },
          body: JSON.stringify({ numero, prenom, email })
        });

        const message = await response.text();
        resultDiv.innerText = message;
        document.getElementById('formulaire').style.display = 'none';
      } catch (error) {
        resultDiv.innerText = "❌ Erreur lors de l'inscription.";
      }

      loading.style.display = 'none';
    }
  </script>
</body>
</html>
