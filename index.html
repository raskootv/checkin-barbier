<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sixty Five - Check-in Client</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #facc15;
      --primary-dark: #eab308;
      --bg: #0f0f0f;
      --card-bg: #1c1c1c;
      --text: #ffffff;
      --text-muted: #a1a1aa;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0c0c0c, #1a1a1a);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      background: var(--card-bg);
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      max-width: 400px;
      width: 100%;
      text-align: center;
    }

    .logo {
      width: 60px;
      height: 60px;
      border-radius: 9999px;
      margin: 0 auto 1rem;
      background: url('/logo.png') no-repeat center/cover;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
    }

    p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }

    input, button {
      width: 100%;
      padding: 0.9rem;
      margin-top: 0.75rem;
      border-radius: 0.5rem;
      font-size: 1rem;
      border: none;
      outline: none;
    }

    input {
      background: #2c2c2c;
      color: var(--text);
    }

    button {
      background: var(--primary);
      color: #000;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      background: var(--primary-dark);
    }

    #formulaire {
      display: none;
      flex-direction: column;
    }

    #result, #loading {
      margin-top: 1rem;
      font-weight: bold;
      text-align: center;
    }

    .review-box {
      margin-top: 2rem;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .review-box a {
      color: var(--primary);
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo"></div>
    <h1>Bienvenue chez Sixty Five</h1>
    <p id="description">Validez votre passage ou inscrivez-vous à notre programme de fidélité</p>

    <div id="checkin-section">
      <input type="tel" id="numero" placeholder="Numéro de téléphone">
      <button onclick="checkIn()">Valider ma visite</button>
    </div>

    <div id="formulaire">
      <input type="text" id="prenom" placeholder="Prénom">
      <input type="email" id="email" placeholder="Email">
      <button onclick="inscrireClient()">S'inscrire</button>
    </div>

    <div id="loading" style="display:none;">⏳ Chargement...</div>
    <div id="result"></div>

    <div class="review-box">
      Vous avez aimé votre expérience ? <a href="https://share.google/eS4hHuBINxkCpoQsx" target="_blank">Laissez-nous un avis Google ⭐</a>
    </div>
  </div>

  <script>
    const API_URL = "/api/checkin";

    function nettoyerNumero(input) {
      let n = input.replace(/\s+/g, '').replace(/^\+33/, '0');
      return n;
    }

    window.onload = () => {
      document.getElementById('numero').value = '';
      document.getElementById('prenom').value = '';
      document.getElementById('email').value = '';
    }

    async function checkIn() {
      const brut = document.getElementById('numero').value.trim();
      const numero = nettoyerNumero(brut);
      const resultDiv = document.getElementById('result');
      const formulaire = document.getElementById('formulaire');
      const loading = document.getElementById('loading');
      const checkinSection = document.getElementById('checkin-section');
      const description = document.getElementById('description');

      resultDiv.innerText = '';
      if (!numero) return resultDiv.innerText = "❌ Merci d’entrer un numéro.";

      loading.style.display = 'block';
      formulaire.style.display = 'none';

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ numero })
        });

        let message = await response.text();
        message = message.replace(/\b(\d{1,2})\/(\d{1,2})\/(\d{4})\b/g, (match, m, d, y) => {
          const date = new Date(`${y}-${m}-${d}`);
          return date.toLocaleDateString('fr-FR');
        });

        if (message.includes("Numéro inconnu")) {
          resultDiv.innerText = "📞 Nouveau ici ? Inscrivez-vous en 10 secondes.";
          formulaire.style.display = 'flex';
          document.getElementById('numero').readOnly = true;
        } else {
          resultDiv.innerText = message;
          checkinSection.style.display = 'none';
          description.innerText = "Merci pour votre visite et votre fidélité !";
        }
      } catch {
        resultDiv.innerText = "❌ Erreur de connexion.";
      }

      loading.style.display = 'none';
    }

    async function inscrireClient() {
      const brut = document.getElementById('numero').value.trim();
      const numero = nettoyerNumero(brut);
      const prenom = document.getElementById('prenom').value.trim();
      const email = document.getElementById('email').value.trim();
      const resultDiv = document.getElementById('result');
      const loading = document.getElementById('loading');
      const checkinSection = document.getElementById('checkin-section');
      const description = document.getElementById('description');

      resultDiv.innerText = '';
      if (!numero || !prenom || !email) return resultDiv.innerText = "❌ Merci de remplir tous les champs.";

      loading.style.display = 'block';

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ numero, prenom, email })
        });

        let message = await response.text();
        message = message.replace(/\b(\d{1,2})\/(\d{1,2})\/(\d{4})\b/g, (match, m, d, y) => {
          const date = new Date(`${y}-${m}-${d}`);
          return date.toLocaleDateString('fr-FR');
        });

        resultDiv.innerText = message;
        document.getElementById('formulaire').style.display = 'none';
        document.getElementById('prenom').value = '';
        document.getElementById('email').value = '';

        checkinSection.style.display = 'none';
        description.innerText = "Merci pour votre inscription et votre visite !";
        document.getElementById('numero').readOnly = false;
      } catch {
        resultDiv.innerText = "❌ Erreur lors de l'inscription.";
      }

      loading.style.display = 'none';
    }
  </script>
</body>
</html>
